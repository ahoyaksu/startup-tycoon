<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Startup Tycoon</title>
<style>
:root{--bg:#f2f4fb;--card:#fff;--ink:#1c2040;--mute:#6d739b;--line:#e3e6f4;--ind:#5b5bf0;--mint:#12c4a0;--cor:#ff6b5e;--sun:#ffc233;--f:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f);padding-bottom:calc(30px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}
.top{background:linear-gradient(120deg,var(--ind),#8a5bf0 60%,#e05bd0);color:#fff;padding:max(10px,env(safe-area-inset-top)) 16px 14px}
.top .in{max-width:1100px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.money{font-size:clamp(2rem,8vw,3rem);font-weight:900;letter-spacing:-.03em;line-height:1}
.sub{opacity:.9;font-size:.85rem;margin-top:4px}
.chip{background:rgba(255,255,255,.2);border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:700;white-space:nowrap}
.menu{display:flex;gap:6px;flex-wrap:wrap}
.menu button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:700 .8rem var(--f);cursor:pointer}
.ticker{background:#1c2040;color:#ffe9a8;overflow:hidden;white-space:nowrap;height:30px;font-size:.85rem;display:flex;align-items:center}
.ticker span{display:inline-block;padding-left:100%;animation:tk 22s linear forwards}
.ticker b{color:var(--sun);margin-right:8px}
@keyframes tk{to{transform:translateX(-100%)}}
.wrap{max-width:1100px;margin:14px auto;padding:0 12px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:20px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(60,60,140,.07);padding:14px}
.scene{position:relative;border-radius:16px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;overflow:hidden;transition:background .6s}
.scene .bld{font-size:4.6rem;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.scene .nm{font-weight:900;margin-top:4px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.crew{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:1.1rem;margin-top:6px;max-height:64px;overflow:hidden}
#big{display:block;margin:14px auto 4px;width:min(260px,70%);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#8f8fff,var(--ind));color:#fff;font:900 1.1rem var(--f);cursor:pointer;box-shadow:0 10px 0 #3a3ac4,0 18px 30px rgba(91,91,240,.35);transition:transform .06s,box-shadow .06s;touch-action:manipulation}
#big span{display:block;font-size:3.4rem}
#big:active,#big.p{transform:translateY(8px);box-shadow:0 2px 0 #3a3ac4,0 6px 12px rgba(91,91,240,.3)}
.cl{text-align:center;color:var(--mute);font-size:.85rem}
#ev{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.evc{border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:700;animation:pop .3s}
.evc.crash{background:#ffe3e0;color:#a02c20}.evc.inv{background:#e0f7ef;color:#0b6f58}.evc.buff{background:#fff3cc;color:#7a5600}
.evc button{margin-left:auto;border:0;border-radius:10px;padding:8px 12px;font:800 .8rem var(--f);cursor:pointer;background:#fff;color:inherit;box-shadow:0 2px 0 rgba(0,0,0,.15)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#bird{position:absolute;font-size:2.6rem;cursor:pointer;animation:fly 12s linear forwards;z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
@keyframes fly{from{left:-10%}to{left:105%}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tabs button{border:0;background:#eef0fb;color:var(--mute);padding:9px 14px;border-radius:12px;font:800 .85rem var(--f);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ind);color:#fff}
.qty{display:flex;gap:6px;margin:6px 0 10px}.qty button{flex:1;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px;font:800 .8rem var(--f);cursor:pointer;color:var(--mute)}.qty button.on{border-color:var(--ind);color:var(--ind)}
.it{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff}
.it .ic{font-size:1.8rem;width:44px;height:44px;border-radius:12px;background:#f0f2ff;display:flex;align-items:center;justify-content:center;flex:none}
.it .tx{flex:1;min-width:0}.it b{display:block}.it small{color:var(--mute);display:block;font-size:.78rem;line-height:1.25}
.buy{border:0;border-radius:12px;padding:9px 12px;font:900 .85rem var(--f);background:var(--mint);color:#04332a;cursor:pointer;min-width:84px;box-shadow:0 3px 0 #0b8b72}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #0b8b72}.buy:disabled{background:#e5e7f4;color:#9aa0c4;box-shadow:none;cursor:not-allowed}
.cnt{background:var(--ind);color:#fff;border-radius:99px;padding:0 8px;font-size:.75rem;margin-left:6px}
.ach{opacity:.45;filter:grayscale(1)}.ach.got{opacity:1;filter:none;border-color:var(--sun);background:#fffbea}
.fl{position:fixed;pointer-events:none;font-weight:900;font-size:1.3rem;color:#12c4a0;text-shadow:0 2px 0 #fff,0 0 8px #fff;animation:up .9s ease-out forwards;z-index:50}
@keyframes up{to{transform:translateY(-80px);opacity:0}}
.pt{position:fixed;pointer-events:none;font-size:1rem;z-index:49;animation:pt .7s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);background:#1c2040;color:#fff;padding:10px 16px;border-radius:14px;z-index:99;transition:.3s;font-weight:700;max-width:92vw;text-align:center}.toast.on{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(20,20,50,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal .box{background:#fff;border-radius:22px;padding:20px;max-width:440px;width:100%}.modal h3{margin-bottom:8px}
.modal textarea{width:100%;height:110px;border:2px solid var(--line);border-radius:12px;padding:8px;font:12px monospace;user-select:text;-webkit-user-select:text;margin:8px 0}
.modal .r{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.modal button{flex:1;border:0;border-radius:12px;padding:10px;font:800 .9rem var(--f);cursor:pointer;background:var(--ind);color:#fff}.modal button.g{background:#eef0fb;color:var(--ink)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div><div class="money" id="money">$0</div><div class="sub"><span id="cps">$0/s</span> · <span id="mult"></span></div></div>
  <div class="menu"><span class="chip" id="shch">📈 0 shares</span><button id="bSave">💾 Save / Load</button></div>
</div></div>
<div class="ticker" aria-live="off"><span id="tk"><b>NEWS</b>Your startup has been founded. The garage smells like regret and pizza.</span></div>

<div class="wrap">
  <section class="card">
    <div class="scene" id="scene"><div class="bld" id="bld">🏚️</div><div class="nm" id="nm">Garage</div><div class="crew" id="crew"></div></div>
    <button id="big" aria-label="Write code"><span>⌨️</span>WRITE CODE</button>
    <div class="cl" id="cl"></div>
    <div id="ev"></div>
  </section>
  <section class="card">
    <div class="tabs" id="tabs"></div>
    <div id="pane"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){if(!isFinite(n))return'∞';if(n<1000)return n<10&&n%1?n.toFixed(2):n<100&&n%1?n.toFixed(1):Math.floor(n).toString();const i=Math.floor(Math.log10(n)/3);if(i>=SUF.length)return n.toExponential(2);return(n/Math.pow(1000,i)).toFixed(2)+SUF[i]}
const $$=n=>'$'+fmt(n);
const GEN=[
 {id:'intern',n:'Intern',i:'🧑‍🎓',cost:15,cps:.5,d:'Runs on pizza and hope.'},
 {id:'dev',n:'Junior Dev',i:'👩‍💻',cost:120,cps:4,d:'Googles everything. Ships anyway.'},
 {id:'des',n:'Designer',i:'🎨',cost:1100,cps:22,d:'Makes it pop. Then un-pops it.'},
 {id:'sen',n:'Senior Dev',i:'🧙',cost:12000,cps:140,d:'Says "it depends" and is right.'},
 {id:'ai',n:'AI Agent',i:'🤖',cost:130000,cps:900,d:'Never sleeps. Occasionally hallucinates revenue.'},
 {id:'dc',n:'Data Center',i:'🗄️',cost:1.4e6,cps:6500,d:'Loud, warm, profitable.'},
 {id:'qu',n:'Quantum Lab',i:'⚛️',cost:2e7,cps:50000,d:'Both profitable and not, until audited.'},
 {id:'rk',n:'Rocket Division',i:'🚀',cost:3.3e8,cps:400000,d:'Disrupting gravity.'}];
const UPG=[
 {id:'u1',n:'Mechanical Keyboard',d:'Click power ×2. Clacky.',cost:100,t:'click',m:2},
 {id:'u2',n:'Dual Monitors',d:'Click power ×2.',cost:750,t:'click',m:2},
 {id:'u3',n:'Coffee IV Drip',d:'Click power ×3.',cost:6000,t:'click',m:3},
 {id:'u4',n:'Neural Autocomplete',d:'Click power ×3.',cost:8e4,t:'click',m:3},
 {id:'u5',n:'Typing Exoskeleton',d:'Click power ×5.',cost:2.5e6,t:'click',m:5},
 {id:'g1',n:'Pizza Fridays',d:'Interns ×2.',cost:400,t:'gen',g:'intern',m:2},
 {id:'g2',n:'Pair Programming',d:'Junior Devs ×2.',cost:3500,t:'gen',g:'dev',m:2},
 {id:'g3',n:'Design Tokens',d:'Designers ×2.',cost:3e4,t:'gen',g:'des',m:2},
 {id:'g4',n:'Code Review Bot',d:'Senior Devs ×2.',cost:3e5,t:'gen',g:'sen',m:2},
 {id:'g5',n:'Fine-Tuned Models',d:'AI Agents ×2.',cost:4e6,t:'gen',g:'ai',m:2},
 {id:'g6',n:'Edge Network',d:'Data Centers ×2.',cost:4e7,t:'gen',g:'dc',m:2},
 {id:'g7',n:'Cryo Cooling',d:'Quantum Labs ×2.',cost:6e8,t:'gen',g:'qu',m:2},
 {id:'g8',n:'Zero-G Standups',d:'Rocket Divisions ×2.',cost:1e10,t:'gen',g:'rk',m:2},
 {id:'a1',n:'Free Snacks',d:'All income ×1.1.',cost:2500,t:'all',m:1.1},
 {id:'a2',n:'Open Office Plan',d:'All income ×1.15. Headphones sold out.',cost:5e4,t:'all',m:1.15},
 {id:'a3',n:'Stock Options',d:'All income ×1.25.',cost:2e6,t:'all',m:1.25},
 {id:'a4',n:'Hustle Culture',d:'All income ×1.5.',cost:2e8,t:'all',m:1.5},
 {id:'a5',n:'Corporate Retreat',d:'All income ×2. Nobody remembers it.',cost:1e10,t:'all',m:2}];
const OFF=[
 {n:'Garage',i:'🏚️',cost:0,m:1,bg:'linear-gradient(135deg,#9aa3b8,#6b7390)'},
 {n:'Co-working Desk',i:'🏬',cost:5000,m:1.4,bg:'linear-gradient(135deg,#7fd1ff,#5b8bf0)'},
 {n:'Small Office',i:'🏢',cost:2e5,m:1.6,bg:'linear-gradient(135deg,#6be3b5,#12a58a)'},
 {n:'Downtown Floor',i:'🏙️',cost:8e6,m:1.8,bg:'linear-gradient(135deg,#ffc233,#ff8a3d)'},
 {n:'Tech Campus',i:'🏛️',cost:4e8,m:2,bg:'linear-gradient(135deg,#ff8fb1,#e05bd0)'},
 {n:'Skyscraper',i:'🌆',cost:3e10,m:2.5,bg:'linear-gradient(135deg,#8a5bf0,#3b2fa8)'},
 {n:'Rocket-Powered HQ',i:'🚀',cost:3e12,m:4,bg:'linear-gradient(135deg,#1c2040,#5b5bf0 60%,#ff6b5e)'}];
const HEAD=["Local startup pivots to AI, then blockchain, then back to AI before lunch.","Intern accidentally deploys to production. Production says thanks.","Your app now has 3 users: you, your mom, and a confused bot.","Investors love your pitch deck. None have opened it.","Standing desk used primarily for sitting.","Coffee machine declared a critical dependency.","Designer moves button 1px. Team celebrates for an hour.","VC asks if you're 'the Uber of Uber'.","Competitor raises $40M for a smart fork.","Slogan updated: 'Move fast and fix things later.'","Study: 9 of 10 meetings could have been a click.","Server room now doubles as a nap room.","CEO's morning routine involves 14 browser tabs and a cold plunge.","Your landing page loads in 0.3s. The signup form takes 4 days.","Breaking: someone said 'synergy' unironically.","Bug renamed 'surprise feature'. Customers delighted.","Startup achieves unicorn status in a dream.","Engineers agree on tabs vs spaces. Reality glitches.","Whiteboard erased. 3 million dollar idea lost forever.","HR introduces mandatory fun on Thursdays.","Your AI agent has opinions about your roadmap.","Rocket HQ neighbors file noise complaint with the Moon.","Venture capitalist spotted wearing a hoodie. Markets confused.","Company offsite planned. Location: another meeting room."];
const ACH=[
 ['First line of code','Click once',s=>s.clicks>=1],['Keyboard warrior','100 clicks',s=>s.clicks>=100],['Carpal tunnel','1,000 clicks',s=>s.clicks>=1000],['Click maniac','10,000 clicks',s=>s.clicks>=10000],
 ['Ramen profitable','Earn $1K total',s=>s.life>=1e3],['Seed round','Earn $1M total',s=>s.life>=1e6],['Unicorn','Earn $1B total',s=>s.life>=1e9],['Trillionaire','Earn $1T total',s=>s.life>=1e12],['Beyond money','Earn $1Qa total',s=>s.life>=1e15],
 ['Intern army','25 Interns',s=>s.own.intern>=25],['Merge conflict','10 Junior Devs',s=>s.own.dev>=10],['Pixel perfect','10 Designers',s=>s.own.des>=10],['Wizard council','10 Senior Devs',s=>s.own.sen>=10],['Skynet intern','10 AI Agents',s=>s.own.ai>=10],
 ['Headcount','Own 100 staff',s=>GEN.reduce((a,g)=>a+(s.own[g.id]||0),0)>=100],
 ['Shopper','Buy your first upgrade',s=>s.up.length>=1],['Optimizer','Buy 10 upgrades',s=>s.up.length>=10],
 ['Moving up','Reach the Co-working Desk',s=>s.office>=1],['Corner office','Reach the Small Office',s=>s.office>=2],['To infinity','Reach the Rocket HQ',s=>s.office>=6],
 ['Going public','Complete an IPO',s=>s.ipos>=1],['Serial founder','Complete 5 IPOs',s=>s.ipos>=5],
 ['Did you try rebooting','Fix a server crash',s=>s.st.reboots>=1],['Shark bait','Accept an investor offer',s=>s.st.deals>=1],['Birdwatcher','Catch a viral tweet',s=>s.st.tweets>=1],
 ['Passive income','Reach $1K/s',s=>cps()>=1e3],['Money machine','Reach $1M/s',s=>cps()>=1e6]];
let S;
const fresh=()=>({money:0,run:0,life:0,clicks:0,own:{},up:[],office:0,shares:0,ipos:0,ach:[],st:{reboots:0,deals:0,tweets:0},buf:{frenzy:0,crash:0,dip:0},last:Date.now()});
function load(raw){try{const o=JSON.parse(raw);S=Object.assign(fresh(),o);S.st=Object.assign({reboots:0,deals:0,tweets:0},o.st);S.buf=Object.assign({frenzy:0,crash:0,dip:0},o.buf);return true}catch(e){return false}}
function save(){S.last=Date.now();try{localStorage.setItem('stt-save',JSON.stringify(S))}catch(e){}}
// ---------- math
const gm=id=>UPG.filter(u=>S.up.includes(u.id)&&u.t==='gen'&&u.g===id).reduce((a,u)=>a*u.m,1);
function glob(){const now=Date.now();let m=(1+.1*S.shares)*OFF[S.office].m*(1+.02*S.ach.length);UPG.forEach(u=>{if(u.t==='all'&&S.up.includes(u.id))m*=u.m});
  if(S.buf.frenzy>now)m*=7;if(S.buf.crash>now)m*=.3;if(S.buf.dip>now)m*=.85;return m}
const rawCps=()=>GEN.reduce((a,g)=>a+(S.own[g.id]||0)*g.cps*gm(g.id),0);
const cps=()=>rawCps()*glob();
const clickMul=()=>UPG.filter(u=>S.up.includes(u.id)&&u.t==='click').reduce((a,u)=>a*u.m,1);
const clickVal=()=>(clickMul()+rawCps()*.03)*glob();
const gcost=(g,n=1)=>{const o=S.own[g.id]||0,r=1.15;return g.cost*Math.pow(r,o)*(Math.pow(r,n)-1)/(r-1)};
const maxN=g=>{const o=S.own[g.id]||0,r=1.15;const n=Math.floor(Math.log(S.money*(r-1)/(g.cost*Math.pow(r,o))+1)/Math.log(r));return Math.max(0,n)};
const ipoGain=()=>Math.floor(Math.sqrt(S.run/1e7));
// ---------- UI helpers
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function floatTxt(t,x,y,c){const d=document.createElement('div');d.className='fl';d.textContent=t;d.style.left=x-20+'px';d.style.top=y-30+'px';if(c)d.style.color=c;document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
function burst(x,y){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<5;i++){const p=document.createElement('div');p.className='pt';p.textContent=['💰','✨','💾','⭐'][i%4];p.style.left=x+'px';p.style.top=y+'px';const a=Math.random()*6.28,d=30+Math.random()*40;p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d-20+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),700)}}
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box">${h}</div>`;document.body.appendChild(m);m.onclick=e=>{if(e.target===m)m.remove()};return m}
// ---------- click
function doClick(x,y){const v=clickVal();S.money+=v;S.run+=v;S.life+=v;S.clicks++;floatTxt('+'+$$(v),x,y);burst(x,y);const b=$('big');b.classList.add('p');setTimeout(()=>b.classList.remove('p'),70)}
$('big').addEventListener('pointerdown',e=>{doClick(e.clientX,e.clientY);e.preventDefault()});
$('big').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const r=$('big').getBoundingClientRect();doClick(r.left+r.width/2,r.top+r.height/3);e.preventDefault()}});
// ---------- tabs
const TABS=[['hire','👥 Hire'],['up','🛠️ Upgrades'],['off','🏢 Offices'],['ipo','📈 IPO'],['ach','🏆 Trophies']];
let tab='hire',qty=1,upKey='';
$('tabs').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
$('tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;buildPane()}};
function buildPane(){[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===tab));const p=$('pane');upKey='';
  if(tab==='hire'){p.innerHTML=`<div class="qty">${[1,10,100,'Max'].map(q=>`<button data-q="${q}" class="${q===qty?'on':''}">×${q}</button>`).join('')}</div>`+GEN.map(g=>`<div class="it" data-g="${g.id}"><div class="ic">${g.i}</div><div class="tx"><b>${g.n}<span class="cnt">0</span></b><small>${g.d}</small><small class="in"></small></div><button class="buy"></button></div>`).join('');
    p.onclick=e=>{if(e.target.dataset.q){qty=e.target.dataset.q==='Max'?'Max':+e.target.dataset.q;buildPane();return}const it=e.target.closest('.it');if(it&&e.target.closest('.buy'))buyGen(it.dataset.g)}}
  else if(tab==='up'){p.onclick=e=>{const b=e.target.closest('.buy');if(b)buyUp(b.dataset.u)};upList()}
  else if(tab==='off'){p.innerHTML=OFF.map((o,i)=>`<div class="it" data-o="${i}"><div class="ic">${o.i}</div><div class="tx"><b>${o.n}</b><small>All income ×${o.m} (replaces previous bonus)</small></div><button class="buy"></button></div>`).join('');p.onclick=e=>{if(e.target.closest('.buy'))buyOff(+e.target.closest('.it').dataset.o)}}
  else if(tab==='ipo'){p.innerHTML=`<div class="it" style="display:block;line-height:1.5"><b style="font-size:1.1rem">📈 Go public (IPO)</b><small style="font-size:.9rem;margin:6px 0">Cash out your company for shares. You restart from the garage, but every share gives <b>+10% income forever</b>. Upgrades, hires and offices reset. Trophies stay.</small><div>Shares owned: <b id="ipS"></b> (×<span id="ipM"></span>)</div><div>Shares from this run: <b id="ipG"></b></div><button class="buy" id="ipB" style="width:100%;margin-top:10px;padding:14px">Go public</button><small id="ipH" style="margin-top:8px"></small></div>`;$('ipB').onclick=ipo;p.onclick=null}
  else{p.innerHTML=ACH.map((a,i)=>`<div class="it ach" data-a="${i}"><div class="ic">🏆</div><div class="tx"><b>${a[0]}</b><small>${a[1]}</small></div></div>`).join('')+`<small style="color:var(--mute)">Each trophy gives +2% income.</small>`;p.onclick=null}
  tick(0)}
function upList(){const av=UPG.filter(u=>!S.up.includes(u.id)&&S.money>=u.cost*.25),key=av.map(u=>u.id).join();if(key===upKey)return;upKey=key;
  $('pane').innerHTML=av.length?av.map(u=>`<div class="it"><div class="ic">${u.t==='click'?'🖱️':u.t==='all'?'🌟':GEN.find(g=>g.id===u.g).i}</div><div class="tx"><b>${u.n}</b><small>${u.d}</small></div><button class="buy" data-u="${u.id}">${$$(u.cost)}</button></div>`).join(''):'<p style="color:var(--mute);padding:20px;text-align:center">No upgrades yet. Keep earning and new ones appear.</p>'}
function buyGen(id){const g=GEN.find(x=>x.id===id);let n=qty==='Max'?Math.max(1,maxN(g)):qty;const c=gcost(g,n);if(S.money<c)return;S.money-=c;S.own[id]=(S.own[id]||0)+n;crew()}
function buyUp(id){const u=UPG.find(x=>x.id===id);if(!u||S.up.includes(id)||S.money<u.cost)return;S.money-=u.cost;S.up.push(id);upKey='';upList()}
function buyOff(i){if(i!==S.office+1||S.money<OFF[i].cost)return;S.money-=OFF[i].cost;S.office=i;scene();toast('New HQ unlocked: '+OFF[i].n+'!')}
function ipo(){const gn=ipoGain();if(gn<1)return;if(!confirm(`Go public for ${gn} share${gn>1?'s':''}? Your company resets, but you keep +${gn*10}% permanent income.`))return;
  const keep={shares:S.shares+gn,ipos:S.ipos+1,ach:S.ach,life:S.life,clicks:S.clicks,st:S.st};S=Object.assign(fresh(),keep);save();scene();crew();buildPane();toast(`IPO complete! You now own ${S.shares} shares.`)}
// ---------- scene
function scene(){const o=OFF[S.office];$('scene').style.background=o.bg;$('bld').textContent=o.i;$('nm').textContent=o.n}
function crew(){$('crew').textContent=GEN.map(g=>g.i.repeat(Math.min(S.own[g.id]||0,6))).join('')}
// ---------- events
function evCard(cls,html,btn,fn,ttl){const d=document.createElement('div');d.className='evc '+cls;d.innerHTML=`<span>${html}</span>${btn?`<button>${btn}</button>`:''}`;$('ev').prepend(d);const rm=()=>d.remove();if(btn)d.querySelector('button').onclick=()=>{fn();rm()};setTimeout(rm,ttl);return d}
function spawnEvent(){const r=Math.random();
  if(r<.4){const b=document.createElement('div');b.id='bird';b.textContent='🐦';b.style.top=10+Math.random()*60+'%';b.setAttribute('role','button');b.setAttribute('aria-label','Viral tweet');$('scene').appendChild(b);b.onclick=e=>{S.buf.frenzy=Date.now()+20000;S.st.tweets++;b.remove();toast('🔥 Your tweet went viral! Income ×7 for 20s');evCard('buff','🔥 Viral frenzy: income ×7',null,null,20000)};setTimeout(()=>b.remove(),12100)}
  else if(r<.7){S.buf.crash=Date.now()+20000;const c=evCard('crash','💥 Server crash! Income −70%','Reboot (2%)',()=>{const cost=S.money*.02;S.money-=cost;S.buf.crash=0;S.st.reboots++;toast('Rebooted. Have you tried turning it off and on again?')},20000)}
  else{const gain=Math.max(50,cps()*720);evCard('inv',`🦈 Investor offer: ${$$(gain)} for 5% equity`,'Accept',()=>{S.money+=gain;S.run+=gain;S.life+=gain;S.buf.dip=Date.now()+300000;S.st.deals++;toast('Deal signed! Income −15% for 5 min (equity tax).')},16000)}}
let nextEv=Date.now()+25000;
// ---------- loop
let acc=0,last=performance.now(),tk=0;
function tick(dt){const c=cps();if(dt){S.money+=c*dt;S.run+=c*dt;S.life+=c*dt}
  $('money').textContent=$$(S.money);$('cps').textContent=$$(c)+'/s';$('mult').textContent='×'+glob().toFixed(2)+' income';$('shch').textContent='📈 '+S.shares+' share'+(S.shares===1?'':'s');$('cl').textContent=`+${$$(clickVal())} per click`;
  if(tab==='hire')$('pane').querySelectorAll('.it').forEach(it=>{const g=GEN.find(x=>x.id===it.dataset.g),o=S.own[g.id]||0;let n=qty==='Max'?Math.max(1,maxN(g)):qty,c2=gcost(g,n);it.querySelector('.cnt').textContent=o;it.querySelector('.in').textContent=`${$$(g.cps*gm(g.id)*glob())}/s each`;const b=it.querySelector('.buy');b.textContent=(n>1?'×'+n+' ':'')+$$(c2);b.disabled=S.money<c2});
  else if(tab==='up'){upList();$('pane').querySelectorAll('.buy[data-u]').forEach(b=>b.disabled=S.money<UPG.find(u=>u.id===b.dataset.u).cost)}
  else if(tab==='off')$('pane').querySelectorAll('.it').forEach(it=>{const i=+it.dataset.o,b=it.querySelector('.buy');if(i<=S.office){b.textContent=i===S.office?'Current':'Owned';b.disabled=true}else if(i===S.office+1){b.textContent=$$(OFF[i].cost);b.disabled=S.money<OFF[i].cost}else{b.textContent='🔒';b.disabled=true}})
  else if(tab==='ipo'){const g=ipoGain();$('ipS').textContent=S.shares;$('ipM').textContent=(1+.1*S.shares).toFixed(1);$('ipG').textContent='+'+g;$('ipB').disabled=g<1;$('ipH').textContent=g<1?`Earn ${$$(1e7)} in a single run to get your first share.`:`Next share at ${$$(1e7*Math.pow(g+1,2))} this run.`}
  else if(tab==='ach')$('pane').querySelectorAll('.ach').forEach(el=>el.classList.toggle('got',S.ach.includes(+el.dataset.a)))}
function loop(now){const dt=Math.min(1,(now-last)/1000);last=now;tick(dt);requestAnimationFrame(loop)}
setInterval(()=>{ACH.forEach((a,i)=>{if(!S.ach.includes(i)&&a[2](S)){S.ach.push(i);toast('🏆 '+a[0]+': '+a[1])}});if(Date.now()>nextEv){spawnEvent();nextEv=Date.now()+40000+Math.random()*50000}},1000);
setInterval(save,10000);addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
// news ticker
function news(){const el=$('tk'),pool=[...HEAD];if(S.office>=6)pool.push('Rocket HQ reaches orbit. Standup now held in low gravity.');if(S.shares>0)pool.push('Shareholders thrilled. Mostly by the free lunch.');const h=pool[Math.floor(Math.random()*pool.length)];el.style.animation='none';el.innerHTML=`<b>NEWS</b>${h}`;void el.offsetWidth;el.style.animation=''}
$('tk').addEventListener('animationend',news);
// save / load
$('bSave').onclick=()=>{save();const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const m=modal(`<h3>💾 Save &amp; Load</h3><p style="font-size:.85rem;color:#6d739b">Your game autosaves in this browser. Copy the code below to back it up or move devices.</p><textarea id="sc" readonly></textarea><div class="r"><button id="cp">Copy export</button></div><p style="margin-top:10px;font-size:.85rem;color:#6d739b">Paste a code to import:</p><textarea id="si" placeholder="Paste save code here"></textarea><div class="r"><button id="im">Import</button><button class="g" id="rs">Hard reset</button><button class="g" id="cx">Close</button></div>`);
  m.querySelector('#sc').value=code;m.querySelector('#cp').onclick=()=>{navigator.clipboard?.writeText(code).then(()=>toast('Save code copied'),()=>{m.querySelector('#sc').select()})};
  m.querySelector('#im').onclick=()=>{try{const raw=decodeURIComponent(escape(atob(m.querySelector('#si').value.trim())));if(load(raw)){save();m.remove();scene();crew();buildPane();toast('Save imported')}else throw 0}catch(e){toast('That code is not a valid save.')}};
  m.querySelector('#rs').onclick=()=>{if(confirm('Erase everything, including shares and trophies?')){S=fresh();save();m.remove();scene();crew();buildPane()}};m.querySelector('#cx').onclick=()=>m.remove()};
// ---------- boot
const raw=localStorage.getItem('stt-save');if(!raw||!load(raw))S=fresh();
const away=Math.min((Date.now()-S.last)/1000,8*3600);
if(raw&&away>60&&cps()>0){const gain=cps()*away*.5;S.money+=gain;S.run+=gain;S.life+=gain;modal(`<h3>Welcome back, boss! 👋</h3><p>You were gone ${away>3600?(away/3600).toFixed(1)+' hours':Math.round(away/60)+' minutes'}. Your team worked at half speed and earned <b>${$$(gain)}</b>.</p><div class="r"><button onclick="this.closest('.modal').remove()">Collect</button></div>`)}
S.buf.frenzy=S.buf.crash=S.buf.dip=0;scene();crew();buildPane();news();requestAnimationFrame(loop);
</script>
</body>
</html>
